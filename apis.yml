description: Welly is a health and wellness brand and Certified B Corporation that designs first
  aid and personal care products, best known for its patterned Flex Fabric adhesive bandages, first
  aid kits, hydrocolloid blemish and bug-bite patches, and antiseptic wipes. Founded to make caring
  for everyday cuts, scrapes, and playtime injuries more joyful, Welly sells direct-to-consumer
  through a Shopify storefront at getwelly.com and via national retail partners. As a consumer
  packaged-goods company it publishes no public developer API or documentation; this profile is
  maintained in the API Evangelist network as a company record enriched from its public web presence.
